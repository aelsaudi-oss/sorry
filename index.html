
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I'm Sorry, Hussien ❤️</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(
                -45deg, #ee7752, #e73c7e, #ff69b4, #ff1493, #ff69b4
            );
            background-size: 400% 400%;
            animation: gradientShift 8s ease infinite;
            overflow-x: hidden;
            overflow-y: auto;
            position: relative;
            padding: 24px 0;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .bg-heart {
            position: fixed;
            font-size: 2em;
            opacity: 0.18;
            animation: floatAround 15s ease-in-out infinite;
            pointer-events: none;
            color: white;
        }

        @keyframes floatAround {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(100px, -100px) rotate(90deg); }
            50% { transform: translate(200px, 50px) rotate(180deg); }
            75% { transform: translate(-50px, -50px) rotate(270deg); }
        }

        .container {
            text-align: center;
            padding: 45px 35px;
            background: rgba(255, 255, 255, 0.97);
            border-radius: 32px;
            box-shadow: 0 25px 70px rgba(255, 20, 147, 0.35);
            max-width: 650px;
            width: 90%;
            animation: floatIn 1s ease-out;
            border: 2px solid rgba(255, 105, 180, 0.3);
            position: relative;
            z-index: 10;
        }

        @keyframes floatIn {
            from {
                opacity: 0;
                transform: translateY(-35px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        #mainText {
            font-size: clamp(1.6rem, 5vw, 2.5rem);
            color: #e73c7e;
            margin-bottom: 25px;
            font-weight: 700;
            text-shadow: 2px 2px 8px rgba(255, 105, 180, 0.15);
            animation: pulse 2s ease-in-out infinite;
            line-height: 1.6;
            overflow-wrap: anywhere;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.035); }
        }

        .buttons {
            display: flex;
            gap: 18px;
            justify-content: center;
            flex-wrap: wrap;
            margin: 10px 0 20px;
            min-height: 180px;
            align-items: center;
            position: relative;
            padding: 15px;
        }

        button {
            font-family: 'Poppins', sans-serif;
            font-size: 1rem;
            padding: 16px 25px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.13);
            position: relative;
            touch-action: manipulation;
        }

        #yesBtn {
            background: linear-gradient(135deg, #ff69b4, #ff1493);
            color: white;
            position: relative;
            z-index: 5;
        }

        #yesBtn:hover {
            transform: translateY(-5px) scale(1.06);
            box-shadow: 0 15px 35px rgba(255, 20, 147, 0.35);
        }

        #noBtn {
            background: linear-gradient(135deg, #ffb6c1, #ff69b4);
            color: white;
            position: absolute;
            z-index: 10;
            transition: left 0.15s ease-out, top 0.15s ease-out,
                        transform 0.15s ease-out;
            white-space: nowrap;
        }

        #emojiContainer {
            font-size: clamp(2rem, 7vw, 3.5rem);
            margin-top: 25px;
            animation: bounce 1s ease infinite;
            letter-spacing: 5px;
            overflow-wrap: anywhere;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .hidden {
            display: none;
        }

        .heart {
            position: fixed;
            font-size: 2rem;
            animation: floatUp 4s ease-in-out forwards;
            pointer-events: none;
            z-index: 1000;
        }

        @keyframes floatUp {
            0% {
                opacity: 1;
                transform: translateY(0) rotate(0deg) scale(0.8);
            }
            100% {
                opacity: 0;
                transform: translateY(-85vh) rotate(360deg) scale(1.4);
            }
        }

        .shake {
            animation: shake 0.5s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-7px) rotate(-2deg); }
            75% { transform: translateX(7px) rotate(2deg); }
        }

        #clickCount {
            margin-top: 15px;
            font-size: 0.95rem;
            color: #e73c7e;
            font-weight: 600;
            min-height: 28px;
            line-height: 1.6;
        }

        .sparkle {
            position: fixed;
            width: 9px;
            height: 9px;
            background: white;
            border-radius: 50%;
            pointer-events: none;
            animation: sparkleAnim 1s ease-out forwards;
            z-index: 999;
        }

        @keyframes sparkleAnim {
            0% { opacity: 1; transform: scale(0); }
            50% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(0); }
        }

        @media (max-width: 600px) {
            .container {
                padding: 32px 18px;
                width: 92%;
                border-radius: 25px;
            }

            .buttons {
                min-height: 260px;
                padding: 10px;
                gap: 12px;
            }

            button {
                font-size: 0.88rem;
                padding: 14px 19px;
                max-width: 100%;
            }

            #clickCount {
                font-size: 0.85rem;
            }

            .bg-heart {
                font-size: 1.5rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>

<body>
    <div class="bg-heart" style="top: 10%; left: 10%;">❤️</div>
    <div class="bg-heart" style="top: 70%; left: 80%; animation-delay: 2s;">💖</div>
    <div class="bg-heart" style="top: 30%; left: 85%; animation-delay: 4s;">💕</div>
    <div class="bg-heart" style="top: 60%; left: 15%; animation-delay: 6s;">💗</div>
    <div class="bg-heart" style="top: 20%; left: 50%; animation-delay: 8s;">💝</div>

    <main class="container">
        <div id="mainText">
            Hussien, I'm really sorry ❤️<br>
            Please forgive me, babe 🥺💕
        </div>

        <div class="buttons">
            <button id="yesBtn">Okay, I forgive you 💖</button>
            <button id="noBtn">No, I'm still angry 😠</button>
        </div>

        <div id="clickCount" aria-live="polite"></div>
        <div id="emojiContainer" class="hidden"></div>
    </main>

    <script>
        const mainText = document.getElementById('mainText');
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const emojiContainer = document.getElementById('emojiContainer');
        const clickCount = document.getElementById('clickCount');
        const buttonsContainer = document.querySelector('.buttons');

const sorryMessages = [
    "I'm sorry, babe ❤️ I didn't mean to upset you.",
    "I know I messed up, and I genuinely feel bad 🥺",
    "You matter too much to me for me to leave things like this 💕",
    "I wish I could take back what happened 😔❤️",
    "I hope we can put this behind us and be okay again 🫶",
    "I owe you a proper apology and a hug 🤍",
    "You're my favorite person, even when you're mad at me 🥹💕",
    "I messed up this time, but I hope you know how much I care ❤️",
    "I miss our usual vibe already 🥲💗",
    "I'll try to do better, because you deserve that.",
    "Can we make peace over ice cream? 🍦🤍",
    "I'm sorry for being the reason you're upset, love ❤️",
    "I care about us, and I don't want a silly mistake to get in the way 💕",
    "Okay, I admit it... I owe you one 😔🤍",
    "Truce? I'll bring the snacks 🫶🍫"
];

        let currentMessageIndex = 0;
        let noClickCount = 0;
        let isForgiven = false;

        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i
            .test(navigator.userAgent);

        function createSparkle(x, y) {
            for (let i = 0; i < 5; i++) {
                const sparkle = document.createElement('div');
                sparkle.className = 'sparkle';
                sparkle.style.left = (
                    x + (Math.random() - 0.5) * 50
                ) + 'px';
                sparkle.style.top = (
                    y + (Math.random() - 0.5) * 50
                ) + 'px';

                document.body.appendChild(sparkle);
                setTimeout(() => sparkle.remove(), 1000);
            }
        }

        function createHeart() {
            if (document.querySelectorAll('.heart').length > 45) return;

            const heart = document.createElement('div');
            heart.className = 'heart';

            const hearts = ['❤️', '💖', '💕', '💗', '💝', '🥰', '😍'];
            heart.textContent = hearts[
                Math.floor(Math.random() * hearts.length)
            ];

            heart.style.left = Math.random() * (window.innerWidth - 40) + 'px';
            heart.style.top = window.innerHeight + 'px';

            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 4000);
        }

        function updateMessage() {
            currentMessageIndex =
                (currentMessageIndex + 1) % sorryMessages.length;

            mainText.innerHTML = sorryMessages[currentMessageIndex];
            mainText.classList.remove('shake');

            // Restart the shake animation.
            void mainText.offsetWidth;
            mainText.classList.add('shake');

            setTimeout(() => {
                mainText.classList.remove('shake');
            }, 500);
        }

        function updateAttemptMessage() {
            if (noClickCount <= 5) {
                clickCount.textContent =
                    `Come on, Hussien... give me a chance! 🥺 (Attempts: ${noClickCount})`;
            } else if (noClickCount <= 10) {
                clickCount.textContent =
                    `Please, babe! 😭 (Attempts: ${noClickCount})`;
            } else {
                clickCount.textContent =
                    `Hussien, the apologies are never-ending! 💪❤️ (Attempts: ${noClickCount})`;
            }
        }

        function moveNoButton() {
            if (isForgiven) return;

            const rect = buttonsContainer.getBoundingClientRect();
            const btnRect = noBtn.getBoundingClientRect();
            const yesRect = yesBtn.getBoundingClientRect();

            const padding = 8;
            const maxX = Math.max(
                padding,
                rect.width - btnRect.width - padding
            );
            const maxY = Math.max(
                padding,
                rect.height - btnRect.height - padding
            );

            let newX = padding;
            let newY = padding;
            let foundPosition = false;

            for (let i = 0; i < 60; i++) {
                newX = padding + Math.random() * (maxX - padding);
                newY = padding + Math.random() * (maxY - padding);

                const noLeft = rect.left + newX;
                const noRight = noLeft + btnRect.width;
                const noTop = rect.top + newY;
                const noBottom = noTop + btnRect.height;

                const gap = 12;

                const overlaps = !(
                    noRight + gap < yesRect.left ||
                    noLeft - gap > yesRect.right ||
                    noBottom + gap < yesRect.top ||
                    noTop - gap > yesRect.bottom
                );

                if (!overlaps) {
                    foundPosition = true;
                    break;
                }
            }

            noBtn.style.left = newX + 'px';
            noBtn.style.top = newY + 'px';
            noBtn.style.transform = 'none';

            if (foundPosition) {
                const newRect = noBtn.getBoundingClientRect();
                createSparkle(
                    newRect.left + newRect.width / 2,
                    newRect.top + newRect.height / 2
                );
            }

            noClickCount++;

            const newScale = Math.max(0.65, 1 - noClickCount * 0.035);
            noBtn.style.scale = String(newScale);

            const yesScale = Math.min(1.5, 1 + noClickCount * 0.025);
            yesBtn.style.scale = String(yesScale);
        }

        function initNoButton() {
            const isMobileView = window.innerWidth <= 600;

            noBtn.style.left = isMobileView ? '50%' : '70%';
            noBtn.style.top = isMobileView ? '72%' : '50%';
            noBtn.style.transform = 'translate(-50%, -50%)';
            noBtn.style.scale = '1';
        }

        initNoButton();

        window.addEventListener('resize', () => {
            if (!isForgiven) initNoButton();
        });

        // On desktop, the No button runs away when hovered.
        if (!isMobile) {
            noBtn.addEventListener('mouseenter', () => {
                if (isForgiven) return;

                moveNoButton();
                updateMessage();
                updateAttemptMessage();
                createHeart();
            });
        }

        // On mobile, tapping No moves it and changes the apology.
        noBtn.addEventListener('click', (event) => {
            event.preventDefault();
            if (isForgiven) return;

            moveNoButton();
            updateMessage();
            updateAttemptMessage();
            createHeart();
        });

        // Yes button: forgiveness celebration.
        yesBtn.addEventListener('click', () => {
            if (isForgiven) return;
            isForgiven = true;

            mainText.innerHTML =
                "Hussien forgave me! 😍💖🥹<br>love you! ❤️";

            emojiContainer.textContent =
                "😊❤️💃🎉✨🥰💕🌟🎊💖🌹😘";

            emojiContainer.classList.remove('hidden');
            clickCount.textContent =
                "HUSSIEN, YOU MEAN THE WORLD TO ME! ❤️🥹";

            buttonsContainer.style.display = 'none';

            document.body.style.background =
                'linear-gradient(-45deg, #ff69b4, #ff1493, #ffc0cb, #ff69b4)';

            document.body.style.backgroundSize = '400% 400%';

            for (let i = 0; i < 30; i++) {
                setTimeout(() => createHeart(), i * 150);
            }
        });

        // Make the Yes button gradually more tempting.
        setInterval(() => {
            if (noClickCount > 3 && !isForgiven) {
                const scale = Math.min(
                    1.5,
                    1.1 + noClickCount * 0.025
                );
                yesBtn.style.scale = String(scale);
            }
        }, 300);
    </script>
</body>
</html>
